<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entretien Ferme</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#1f2a1f;--mut:#6b756b;--pri:#2f6b3a;--onpri:#fff;--bd:#dcd8cc;--ok:#2f6b3a;--warn:#b7791f;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141a14;--card:#1e271e;--tx:#e8ede6;--mut:#9aa69a;--pri:#6fbf7d;--onpri:#10200f;--bd:#2f3a2f;--ok:#6fbf7d;--warn:#e0b04f;--bad:#f2867f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141a14;--card:#1e271e;--tx:#e8ede6;--mut:#9aa69a;--pri:#6fbf7d;--onpri:#10200f;--bd:#2f3a2f;--ok:#6fbf7d;--warn:#e0b04f;--bad:#f2867f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{--nav:0px}
#app,.gh>div{max-width:640px;margin:0 auto;padding:12px 12px calc(96px + var(--nav))}
h1{font-size:20px;margin:6px 4px 10px}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.tab,.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
.chip{padding:5px 12px;font-size:14px}
.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:8px 0;cursor:pointer}
.th{width:88px;height:64px;border-radius:10px;object-fit:cover;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.grow{flex:1;min-width:0}.mut{color:var(--mut);font-size:14px}
.b{display:inline-block;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:600;border:1px solid currentColor}
.l0{color:var(--ok)}.l1{color:var(--warn)}.l2{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit}
.p,.g,.r{border-radius:10px;padding:9px 14px;border:1px solid var(--pri);cursor:pointer}
.p{background:var(--pri);color:var(--onpri)}.g{background:transparent;color:var(--tx);border-color:var(--bd)}.r{background:transparent;color:var(--bad);border-color:var(--bad)}
.big{width:100%;margin-top:6px}
.photo{width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin-bottom:8px}
.note{background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:10px;font-size:14px;color:var(--mut);margin:8px 0}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.md{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + max(env(safe-area-inset-bottom,0px),var(--nav)))}
.md h3{margin:0 0 8px}.md label{display:block;font-size:14px;color:var(--mut);margin:8px 0}
.md input,.md select{display:block;width:100%;margin-top:3px;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.hist{font-size:13px;color:var(--mut);margin:4px 0 0 4px}
.tab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag{opacity:.75;transform:scale(1.1);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.dw{justify-content:flex-start;align-items:stretch}
.dp{background:var(--card);width:82%;max-width:320px;height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 8px calc(16px + max(env(safe-area-inset-bottom,0px),var(--nav)))}
.mi{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:14px 12px;border-radius:10px;font:inherit;cursor:pointer}
.mi:active{background:var(--bg)}.sep{height:1px;background:var(--bd);margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 12px;cursor:pointer;min-height:100px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile .ti{font-size:30px;line-height:1.1;margin-bottom:6px}
.tile.add{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--mut);font-size:28px}
.l1b{border-color:var(--warn)}.l2b{border-color:var(--bad)}
.bb{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0 calc(6px + max(env(safe-area-inset-bottom,0px),var(--nav)))}
.bb button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 18px;cursor:pointer}
.bb button.cur{color:var(--pri);font-weight:600}
.bd{position:absolute;top:-6px;right:-12px;background:var(--bad);color:#fff;border-radius:9px;font-size:11px;font-style:normal;padding:0 5px;line-height:16px}
.tk{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:6px 0;overflow:hidden}
.tkh{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}
.tkb{padding:0 10px 10px;border-top:1px dashed var(--bd)}
.al{padding:4px 8px}
.det{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px;cursor:pointer;word-break:break-word}
.src{color:var(--mut);font-size:13px}
.ent{color:var(--tx);padding:6px 0;border-bottom:1px dotted var(--bd);cursor:pointer;word-break:break-word}

.gh{position:fixed;inset:0;z-index:3;background:var(--bg);overflow:hidden;will-change:transform;padding-top:env(safe-area-inset-top,0px)}
#app.pg{touch-action:pan-y}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.gt{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;font-size:12px;color:var(--mut)}
.gt img{display:block;width:100%;height:84px;object-fit:cover;background:var(--bd)}
.gt span{display:block;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk{display:flex;gap:8px;align-items:center;justify-content:space-between}.lk a{color:var(--pri);word-break:break-all}
.toast{position:fixed;left:12px;right:12px;bottom:calc(72px + var(--nav));z-index:6;max-width:616px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:6px 2px}
#bar .bb{z-index:4}
</style></head>

 if(d!=null)l=d<0?2:d<=(+t.remindDays||0)?1:0;
 if(h!=null){const x=h<0?2:h<=(+t.remindHours||0)?1:0;l=Math.max(l,x)}
 const p=[];
 if(d!=null)p.push(d<0?`en retard de ${-d} j`:d==0?"aujourd’hui":`dans ${d} j`);
 if(h!=null)p.push(h<0?`dépassé de ${-h} ${u}`:`dans ${Math.round(h)} ${u}`);

 const upd=()=>{const q=fq.value.trim();m.querySelector("#g1").href="https://www.google.com/search?q="+encodeURIComponent(q+" schéma de graissage OR lubrication chart OR manuel d’entretien pdf");m.querySelector("#g2").href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(q+" lubrication chart schéma de graissage")};
 upd();fq.oninput=upd;
 const item=(x,k,s)=>`<div class="det" style="cursor:default"><b>${esc(x.title||x.url)}</b>${x.type?` <span class="mut">· ${esc(x.type)}</span>`:""}${x.variant=="proche"?" ⚠ modèle proche":""}${x.note?`<br><span class="mut">${esc(x.note)}</span>`:""}<div class="row" style="margin-top:6px"><a class="g" href="${esc(x.url)}" target="_blank" rel="noopener" style="text-decoration:none;color:var(--tx)">Ouvrir</a><button class="g" data-keep="${s}${k}">＋ Garder</button></div></div>`;
 const show=()=>{m.querySelector("#fres").innerHTML=(list.length?`<div class="mut">Liens proposés par l’IA (peuvent être inexacts, vérifie) :</div>`+list.map((x,k)=>item(x,k,"l")).join(""):"")+(srcs.length?`<div class="mut" style="margin-top:8px">Pages consultées par la recherche :</div>`+srcs.map((x,k)=>item(x,k,"s")).join(""):"")};
 m.onclick=async ev=>{const b=ev.target;
  if(b==m||b.dataset.x!==undefined){m.remove();return}
  if(b.dataset.keep){const x=(b.dataset.keep[0]=="l"?list:srcs)[+b.dataset.keep.slice(1)];(e.docs=e.docs||[]).push({id:uid(),kind:"link",title:x.title||x.url,url:x.url,type:x.type||"",ts:new Date().toISOString()});save();render();b.textContent="✓ Gardé";b.disabled=true;return}
  if(b.dataset.go!==undefined){
   if(!ws()){msg("La recherche web est désactivée dans ⚙ Réglages (pour éviter des frais). Utilise les boutons Google ci-dessous, ils sont gratuits.");return}
   const q=fq.value.trim(),ck="d|"+norm(q).replace(/\s+/g," ").trim(),hit=b.dataset.force?null:cacheGet(ck);
   if(hit){list=hit.list;srcs=hit.srcs;addUse(0,true);show();msg("Résultats gardés du "+new Date(hit.t).toLocaleDateString("fr-CA")+" (aucun coût).");m.querySelector("#fre").style.display="";return}
   msg("Recherche en cours… (10 à 30 secondes)");b.disabled=true;
   try{
    const r=await geminiRaw([{text:`Trouve des liens directs vers le schéma ou tableau de graissage, le manuel d’utilisation ou d’entretien et le catalogue de pièces de : ${q}. Respecte rigoureusement la marque, le modèle et la variante exacte ; si la variante exacte est introuvable, donne le modèle le plus proche avec variant "proche" et explique la différence dans note. N’invente jamais d’URL : n’inclus que des adresses réellement vues dans les résultats de recherche. Réponds uniquement avec un tableau JSON d’objets {"title":"","url":"","type":"graissage ou manuel ou pièces ou autre","variant":"exacte ou proche","note":""}. Si rien n’est trouvé, réponds [].`}],{search:true});
    let arr=[];try{arr=JSON.parse(r.text.slice(r.text.indexOf("["),r.text.lastIndexOf("]")+1))}catch(x){}
    list=(Array.isArray(arr)?arr:[]).filter(x=>x&&okUrl(x.url)).map(x=>({...x,url:String(x.url).trim()})).slice(0,8);
    const seen=new Set(list.map(x=>x.url));
    srcs=r.chunks.filter(c=>okUrl(c.uri)&&!seen.has(c.uri)&&seen.add(c.uri)).slice(0,6).map(c=>({title:c.title,url:c.uri,type:""}));
    if(list.length||srcs.length)cachePut(ck,{list,srcs});show();msg((list.length||srcs.length?"":"Rien de précis trouvé. Essaie les boutons Google ci-dessous. ")+r.q+" recherche(s) Google utilisée(s), "+usage().n+" ce mois-ci.");m.querySelector("#fre").style.display=""}
   catch(x){msg("Échec : "+x.message)}
   b.disabled=false}};}
function detail(){const e=S.eq.find(x=>x.id==ui.eq);if(!e){ui.eq=null;return ""}
 const L=S.eq.filter(x=>x.cat==e.cat),n=L.findIndex(x=>x.id==e.id)+1;
 return `<div class="row" style="justify-content:space-between;margin:6px 0"><button class="g" data-a="back">← Retour</button>${L.length>1?`<span class="mut">${n} / ${L.length} · glisse ‹ ›</span>`:""}<button class="g" data-a="editEq" data-i="${e.id}">✎ Modifier</button></div>
 ${e.photo?`<img class="photo" src="${e.photo}" alt="">`:""}<h1>${esc(e.name)}</h1>
 ${e.plate?`<div class="det" data-a="plate" data-i="${e.id}">🏷 ${esc([e.plate.make,e.plate.model].filter(Boolean).join(" "))}${e.plate.serial?" · série "+esc(e.plate.serial):""}${e.plate.year?" · "+esc(e.plate.year):""}${e.plate.other?`<br><span class="mut">${esc(e.plate.other)}</span>`:""}</div>`:`<button class="g" data-a="readPlate" data-i="${e.id}">🏷 Lire la plaque (photo)</button>`}
 <div class="row"><span class="mut">Compteur : <b>${e.hours} ${e.unit||"h"}</b></span><button class="g" data-a="hours" data-i="${e.id}">Mettre à jour</button><button class="g" data-a="readHours" data-i="${e.id}">📷 Lire</button></div>
 <h3>Entretiens</h3>
 ${e.tasks.map(t=>taskRow(e,t)).join("")||`<p class="mut">Aucun entretien encore.</p>`}
 <button class="p big" data-a="addTask" data-i="${e.id}">＋ Ajouter un entretien</button>
 <button class="g big" data-a="ai" data-i="${e.id}">✨ Suggérer des entretiens (IA)</button>
 ${docsHtml(e)}
 <div class="row" style="justify-content:space-between;margin-top:14px"><h3 style="margin:0">Registre</h3><button class="g" data-a="addNote" data-i="${e.id}">＋ Note</button></div>${reg(e)}`}
function bodyHtml(){const t=ui.tab;return t=="todo"?todoView():t=="search"?searchView():t=="home"?homeView():catView()}
function render(){const a=document.getElementById("app");a.classList.add("pg");
 let bar=document.getElementById("bar");if(!bar){bar=document.createElement("div");bar.id="bar";document.body.appendChild(bar)}
 if(ui.eq){a.innerHTML=detail();hydrate(a);bar.innerHTML="";return}
 a.innerHTML=bodyHtml();bar.innerHTML=botBar()}
render();planNotifs();if(!cfg().name&&!cfg().asked)setTimeout(askName,600);
</script></body></html>
