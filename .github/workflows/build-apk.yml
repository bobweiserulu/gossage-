name: Construire APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - name: Preparer le dossier web
        run: |
          mkdir -p www
          cp index.html www/index.html
      - run: npx cap add android
      - name: Icone
        continue-on-error: true
        run: |
          python -m pip install pillow
          python make_icons.py
      - name: Permission notifications
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>#' $M
      - run: npx cap sync android
      - name: Numero de version (monte a chaque compilation)
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
          grep -n "versionCode\|versionName" $G
      - name: Signature fixe
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA256\|Alias"
      - name: Compiler
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Empreinte de signature de l APK
        continue-on-error: true
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA256\|Owner"
      - uses: actions/upload-artifact@v4
        with:
          name: entretien-ferme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
