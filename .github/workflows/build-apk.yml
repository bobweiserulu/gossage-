name: Construire APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - name: Preparer le dossier web
        run: |
          mkdir -p www
          cp index.html www/index.html
      - run: npx cap add android
      - name: Icone
        continue-on-error: true
        run: |
          python -m pip install pillow
          python make_icons.py
      - name: Permission notifications
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>#' $M
      - run: npx cap sync android
      - name: Numero de version (monte a chaque compilation)
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
          grep -n "versionCode\|versionName" $G
      - name: Verifier la cle de signature du depot
        run: |
          test -s debug.keystore || { echo "ERREUR: debug.keystore est absent ou vide a la racine du depot"; exit 1; }
          keytool -list -v -keystore debug.keystore -storepass android | grep -i "Alias\|SHA256"
      - name: Forcer la signature avec debug.keystore
        run: |
          cat > "$GITHUB_WORKSPACE/sign.gradle" <<'GRADLE'
          allprojects { p ->
            p.pluginManager.withPlugin('com.android.application') {
              def sc = p.android.signingConfigs.getByName('debug')
              sc.storeFile = new File(System.getenv('KS'))
              sc.storePassword = 'android'
              sc.keyAlias = 'androiddebugkey'
              sc.keyPassword = 'android'
            }
          }
          GRADLE
      - name: Compiler
        working-directory: android
        env:
          KS: ${{ github.workspace }}/debug.keystore
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -I "$GITHUB_WORKSPACE/sign.gradle"
      - name: Verifier que l APK est signe avec la cle du depot
        run: |
          KS_SHA=$(keytool -list -v -keystore debug.keystore -storepass android | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AS=$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$AS" ] || [ ! -x "$AS" ]; then echo "apksigner introuvable, verification sautee"; exit 0; fi
          APK_SHA=$("$AS" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Cle du depot : $KS_SHA"
          echo "Cle de l APK : $APK_SHA"
          if [ "$KS_SHA" != "$APK_SHA" ]; then echo "ERREUR: l APK n est PAS signe avec debug.keystore"; exit 1; fi
          echo "OK: signature identique"
      - uses: actions/upload-artifact@v4
        with:
          name: entretien-ferme-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publier une Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk entretien-ferme.apk
          gh release create "v1.${{ github.run_number }}" entretien-ferme.apk --target "${{ github.sha }}" --title "Version 1.${{ github.run_number }}" --notes "Compilation automatique numero ${{ github.run_number }}"
